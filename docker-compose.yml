# ============================================================================
#  IVOIRE LAND INTELLIGENCE — Stack complète (PostGIS + PGAdmin + API + Dashboard)
#  Lancement : docker compose up --build
# ============================================================================
services:

  postgis:
    image: postgis/postgis:16-3.4
    container_name: ili_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djiland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djiland}
      POSTGRES_DB: ${POSTGRES_DB:-ivoire_land}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djiland}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ili_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@djiland.ci
      PGADMIN_DEFAULT_PASSWORD: djiland
    ports:
      - "5050:80"
    depends_on:
      - postgis

  api:
    build: .
    container_name: ili_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_HOST: postgis
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgis:
        condition: service_healthy

  dashboard:
    build: .
    container_name: ili_dashboard
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      POSTGRES_HOST: postgis
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      postgis:
        condition: service_healthy

  # --- Optionnel : montée en charge du flywheel avec Celery + Redis ---
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]

volumes:
  postgis_data:
